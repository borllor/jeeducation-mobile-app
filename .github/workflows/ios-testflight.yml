name: iOS build / TestFlight

# Builds the Capacitor iOS app on a GitHub-hosted macOS runner.
#
# Two modes, chosen automatically:
#   * No signing secrets set  -> UNSIGNED COMPILE CHECK only (free, proves the
#     iOS project builds). This is what runs today, before you enroll in the
#     Apple Developer Program.
#   * Signing secrets set     -> ARCHIVE -> EXPORT .ipa -> UPLOAD to TestFlight.
#     Activates automatically once the four secrets below exist.
#
# Required repository secrets for the signed / TestFlight path
# (Settings -> Secrets and variables -> Actions):
#   APPSTORE_API_KEY_ID        App Store Connect API key ID       (e.g. ABCD1234EF)
#   APPSTORE_API_ISSUER_ID     App Store Connect issuer ID        (a UUID)
#   APPSTORE_API_PRIVATE_KEY   Contents of the AuthKey_XXXX.p8    (paste the whole file)
#   APPLE_TEAM_ID              Your 10-char Apple Team ID         (e.g. 9ABCDE1234)
#
# See docs/ios-testflight-setup.md for the full walkthrough.

on:
  workflow_dispatch: {}        # run manually from the Actions tab
  push:
    tags:
      - 'v*'                   # e.g. push tag v1.0.0 to cut a TestFlight build

# NOTE: macOS runner minutes count 10x against the free quota, so this does NOT
# run on every push to main — only on manual dispatch or a version tag.

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 40

    env:
      # True only when ALL signing secrets are present. Drives the mode switch.
      HAS_SIGNING: ${{ secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' && secrets.APPSTORE_API_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      # iPhone X (iPhone 10) and later. Capacitor 6 already defaults to 13.0;
      # we pin it explicitly so the requirement is guaranteed.
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
      MARKETING_VERSION: '1.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (vite -> dist/)
        run: npm run build

      - name: Add / sync iOS platform
        run: |
          if [ -d ios ]; then
            npx cap sync ios
          else
            npx cap add ios
          fi

      # -----------------------------------------------------------------------
      # MODE A: no signing secrets -> just prove the iOS project compiles.
      # -----------------------------------------------------------------------
      - name: Compile check (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "No signing secrets set -> running an UNSIGNED compile check only."
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=${IPHONEOS_DEPLOYMENT_TARGET} \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Next steps hint (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "iOS project builds successfully."
          echo "To produce an installable .ipa and upload to TestFlight, add the"
          echo "four APPSTORE_* / APPLE_TEAM_ID secrets (see docs/ios-testflight-setup.md)."

      # -----------------------------------------------------------------------
      # MODE B: signing secrets present -> archive, export .ipa, upload TestFlight.
      # -----------------------------------------------------------------------
      - name: Prepare App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
          printf '%s' "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > "$KEY_FILE"
          # A local copy for the xcodebuild -authenticationKeyPath flag:
          printf '%s' "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > "$RUNNER_TEMP/AuthKey.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive (automatic signing via API key)
        if: env.HAS_SIGNING == 'true'
        run: |
          # CODE_SIGN_IDENTITY="Apple Distribution" is essential: without it Xcode
          # tries to build an *iOS App Development* profile, which requires at least
          # one registered device and fails with "Your team has no devices...".
          # App Store distribution profiles need no registered devices.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            IPHONEOS_DEPLOYMENT_TARGET=${IPHONEOS_DEPLOYMENT_TARGET} \
            MARKETING_VERSION=${MARKETING_VERSION} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Write ExportOptions.plist
        if: env.HAS_SIGNING == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        if: env.HAS_SIGNING == 'true'
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_ISSUER_ID }}"

      - name: Upload .ipa as workflow artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JE-Education-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_API_ISSUER_ID }}"
